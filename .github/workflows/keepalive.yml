name: Keep Supabase Alive && Upstash

on:
  schedule:
    # Esegue ogni mattina alle 09:00 italiane circa (08:00 UTC)
    - cron: '0 8 * * *'
  workflow_dispatch: # FONDAMENTALE: Ti permette di lanciarla a mano col pulsante

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sveglia Supabase
        # curl fa una richiesta reale.
        # -f fa fallire l'azione se il sito risponde 404 o 500 (così ti arriva la notifica di errore)
        # -L segue eventuali redirect
        run: curl -f -L https://www.sportessence.it/api/keepalive
        
      - name: Sveglia Upstash (Redis)
        # Sostituisci "/Login" con la rotta esatta dove hai attivato il rate-limiter.
        # Uso -s e -o /dev/null per fare la chiamata in modo silenzioso e non intaserare i log di GitHub con l'HTML della pagina.
        run: curl -s -o /dev/null -L https://www.sportessence.it/Login